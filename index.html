function radarChart(scores){
  const keys=['love','harmony','passion','mental','karmic'];
  const colors=keys.map(k=>RING_DEFS.find(r=>r.k===k).c);
  const vals=keys.map(k=>scores[k]/100);
  const n=keys.length,R=120,cx=150,cy=140;
  const angle=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,r)=>({x:cx+r*Math.cos(angle(i)),y:cy+r*Math.sin(angle(i))});
  // Grid rings
  let grid='';
  for(const frac of[.25,.5,.75,1]){
    const pts=keys.map((_,i)=>pt(i,R*frac));
    grid+=`<polygon points="${pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}" fill="none" stroke="rgba(180,140,255,.08)" stroke-width="1"/>`;
  }
  // Axis lines (no text labels — color-coded dots are enough, labels are on the domain rings above)
  let axes='';
  for(let i=0;i<n;i++){
    const p=pt(i,R);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="rgba(180,140,255,.12)" stroke-width="1"/>`;
  }
  // Data polygon
  const dataPts=vals.map((v,i)=>pt(i,R*Math.max(v,.03)));
  const poly=dataPts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  // Dots at vertices (color-coded — same colors as domain rings)
  const dots=dataPts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="${colors[i]}" style="filter:drop-shadow(0 0 5px ${colors[i]}80)"/>`).join('');
  // Score numbers near each vertex
  const scoreTxts=vals.map((v,i)=>{
    const offset=v>.2?-14:14;
    const p=pt(i,R*Math.max(v,.03)+offset);
    return`<text x="${p.x.toFixed(1)}" y="${(p.y+4).toFixed(1)}" text-anchor="middle" fill="${colors[i]}" font-family="Cormorant Garamond,serif" font-size="13" font-weight="600">${scores[keys[i]]}</text>`;
  }).join('');
  return`<div style="text-align:center"><svg viewBox="0 0 300 290" width="300" height="290" xmlns="http://www.w3.org/2000/svg">${grid}${axes}<polygon points="${poly}" fill="rgba(212,168,67,.2)" stroke="rgba(212,168,67,.7)" stroke-width="2" stroke-linejoin="round" style="filter:drop-shadow(0 0 8px rgba(212,168,67,.3))"/>${dots}${scoreTxts}</svg></div>`;
}

// ── Aspect heatmap (11×11 grid) ─────────────────────────────────────────────
function aspectHeatmap(syn,nameA,nameB){
  const planets=[...PLANETS,'Ascendant'];
  // Build lookup: 'pA-pB' → aspect
  const aspMap=new Map();
  for(const p of syn)if(p.asp)aspMap.set(`${p.pA}-${p.pB}`,p.asp);
  const cellSize=38,pad=60;
  const w=pad+planets.length*cellSize,h=pad+planets.length*cellSize;
  let cells='';
  for(let row=0;row<planets.length;row++){
    for(let col=0;col<planets.length;col++){
      const x=pad+col*cellSize,y=pad+row*cellSize;
      const key=`${planets[row]}-${planets[col]}`;
      const asp=aspMap.get(key);
      let fill='rgba(180,140,255,.04)',title=`${planets[row]} × ${planets[col]}: no major aspect (angular separation outside all orbs)`;
      if(asp){
        const hue=asp.h>0?'rgba(74,184,154,':'rgba(196,96,122,';
        const intensity=Math.min(.7,Math.abs(asp.h)*.5+.2);
        fill=`${hue}${intensity.toFixed(2)})`;
        title=`${planets[row]} × ${planets[col]}: ${asp.name} (h=${asp.h>0?'+':''}${asp.h}, orb=${asp.orb_actual}°)`;
      }
      cells+=`<rect x="${x}" y="${y}" width="${cellSize-1}" height="${cellSize-1}" rx="2" fill="${fill}" stroke="rgba(180,140,255,.08)" stroke-width=".5"><title>${title}</title></rect>`;
      if(asp)cells+=`<text x="${x+cellSize/2}" y="${y+cellSize/2+4}" text-anchor="middle" fill="var(--star)" font-family="Cinzel,serif" font-size="11" opacity=".8">${asp.sym}</text>`;
    }
  }
  // Row labels (Partner A planets) — left side
  let labels='';
  for(let i=0;i<planets.length;i++){
    labels+=`<text x="${pad-5}" y="${pad+i*cellSize+cellSize/2+4}" text-anchor="end" fill="var(--rose)" font-family="Cinzel,serif" font-size="12">${PSYM[planets[i]]||'↑'}</text>`;
  }
  // Column labels (Partner B planets) — top
  for(let i=0;i<planets.length;i++){
    labels+=`<text x="${pad+i*cellSize+cellSize/2}" y="${pad-8}" text-anchor="middle" fill="var(--azure)" font-family="Cinzel,serif" font-size="12">${PSYM[planets[i]]||'↑'}</text>`;
  }
  // Partner name labels
  labels+=`<text x="${pad-5}" y="${pad-22}" text-anchor="end" fill="var(--rose)" font-family="Cinzel,serif" font-size="9" letter-spacing=".2em">${nameA}</text>`;
  labels+=`<text x="${pad+planets.length*cellSize/2}" y="${pad-26}" text-anchor="middle" fill="var(--azure)" font-family="Cinzel,serif" font-size="9" letter-spacing=".2em">${nameB}</text>`;
  const _dot=c=>`<span style="display:inline-block;width:10px;height:10px;border-radius:2px;${c};vertical-align:middle;margin-right:4px"></span>`;
  const _grad=c=>`<span style="display:inline-block;width:30px;height:10px;border-radius:2px;background:linear-gradient(90deg,${c.replace('X','.25')},${c.replace('X','.7')});vertical-align:middle;margin-right:4px"></span>`;
  const legend=`<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:8px;font-family:Cinzel,serif;font-size:8px;letter-spacing:.15em;color:var(--silver)"><span>${_grad('rgba(74,184,154,X)')}${t('hmHarmonious')}</span><span>${_grad('rgba(196,96,122,X)')}${t('hmChallenging')}</span><span>${_dot('background:rgba(180,140,255,.04);border:1px solid rgba(180,140,255,.15)')}${t('hmNoAspect')}</span></div>`;
  return`<div style="text-align:center;overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">${cells}${labels}</svg>${legend}</div>`;
}

function renderReport(text){
  const{scoreData,nameA,nameB,syn,chartA,chartB}=STATE,sc=scoreData.scores;
  const ov=sc.overall,compatIdx=ov>=80?0:ov>=65?1:ov>=50?2:ov>=35?3:4;
  const compatName=t('compatTitles')[compatIdx]||I18N.en.compatTitles[compatIdx];

  // ── Compat score gauge (same arc style as confidence gauge) ──
  const gc=cColor(ov);
  const R=90,CX=110,CY=110,SW2=14,totalArc=Math.PI*1.5,startA=Math.PI*.75;
  const toXY=(a,r)=>({x:CX+r*Math.cos(a),y:CY+r*Math.sin(a)});
  const arcP=(sa,sweep,r)=>{const s=toXY(sa,r),e=toXY(sa+sweep,r),lg=sweep>Math.PI?1:0;return`M${s.x.toFixed(2)} ${s.y.toFixed(2)} A${r} ${r} 0 ${lg} 1 ${e.x.toFixed(2)} ${e.y.toFixed(2)}`};
  const filled=totalArc*(ov/100);
  const dot=toXY(startA+filled,R);
  const ticks=Array.from({length:11},(_,i)=>{const a=startA+totalArc*(i/10),r1=R-SW2/2-3,r2=R+SW2/2+3,p1=toXY(a,r1),p2=toXY(a,r2);return`<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" stroke="rgba(212,168,67,.15)" stroke-width="1.5"/>`;}).join('');
  const gaugeHTML=`<div style="display:flex;flex-direction:column;align-items:center;padding:28px 20px 20px">
    <div style="position:relative;width:220px;height:220px;margin:0 auto 16px">
      <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:100%">
        <defs>
          <linearGradient id="cg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="${gc}66"/><stop offset="100%" stop-color="${gc}"/></linearGradient>
          <filter id="gf2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        ${ticks}
        <path d="${arcP(startA,totalArc,R)}" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="${SW2}" stroke-linecap="round"/>
        ${ov>0?`<path d="${arcP(startA,filled,R)}" fill="none" stroke="url(#cg2)" stroke-width="${SW2}" stroke-linecap="round" filter="url(#gf2)"/>
        <circle cx="${dot.x.toFixed(2)}" cy="${dot.y.toFixed(2)}" r="6" fill="${gc}" filter="url(#gf2)"/>`:''}
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
        <div style="font-family:'Cormorant Garamond',serif;font-size:72px;font-weight:600;line-height:1;color:${gc};text-shadow:0 0 36px ${gc}55;letter-spacing:-.02em">${ov}<span style="font-size:30px;opacity:.6">%</span></div>
        <div style="font-family:'Cinzel',serif;font-size:10px;letter-spacing:.3em;color:var(--gold);margin-top:-4px"></div>
      </div>
    </div>
    <div style="font-family:'Cinzel',serif;font-size:11px;letter-spacing:.3em;color:${gc};margin-bottom:6px;text-align:center" data-compat-label>${compatName}</div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;color:var(--pale);text-align:center">${nameA} & ${nameB}</div>
  </div>`;

  document.getElementById('banner').innerHTML=`<div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px">${gaugeHTML}${radarChart(sc)}</div>`;
  document.getElementById('rings').innerHTML=RING_DEFS.map(r=>ring(ringLabel(r),sc[r.k],r.c)).join('');
  document.getElementById('syn-charts').innerHTML=aspectHeatmap(syn,nameA,nameB);
  // Evidence cards — pair-specific descriptions using need/drive labels
  // Evidence cards — need labels with proper articles per language
  // FR/IT: [article, noun] to handle le/la/l'/les/il/lo/la/i
  const _evNeed={
    en:{Sun:'sense of identity',Moon:'emotional needs',Mercury:'way of thinking',Venus:'capacity for love',Mars:'drive and desire',Jupiter:'need for growth',Saturn:'need for structure',Uranus:'urge for freedom',Neptune:'idealism',Pluto:'need for transformation',Ascendant:'outward presence'},
    // [article, noun, plural] — plural flag controls verb conjugation
    fr:{Sun:['le','sens d\'identité'],Moon:['les','besoins émotionnels',1],Mercury:['la','manière de penser'],Venus:['la','capacité d\'aimer'],Mars:['l\'','élan et le désir'],Jupiter:['le','besoin de croissance'],Saturn:['le','besoin de structure'],Uranus:['le','besoin de liberté'],Neptune:['l\'','idéalisme'],Pluto:['le','besoin de transformation'],Ascendant:['la','présence extérieure']},
    it:{Sun:['il','senso di identità'],Moon:['i','bisogni emotivi',1],Mercury:['il','modo di pensare'],Venus:['la','capacità di amare'],Mars:['lo','slancio e il desiderio'],Jupiter:['il','bisogno di crescita'],Saturn:['il','bisogno di struttura'],Uranus:['il','bisogno di libertà'],Neptune:['l\'','idealismo'],Pluto:['il','bisogno di trasformazione'],Ascendant:['la','presenza esteriore']},
  };
  // Verbs: [singular, plural] for FR/IT
  const _evVerb={en:{Conjunction:'merges with',Trine:'flows harmoniously with',Sextile:'cooperates with',Square:'challenges',Opposition:'stands in tension with',Quincunx:'struggles to align with'},
    fr:{Conjunction:['fusionne avec','fusionnent avec'],Trine:['s\'harmonise avec','s\'harmonisent avec'],Sextile:['coopère avec','coopèrent avec'],Square:['défie','défient'],Opposition:['entre en tension avec','entrent en tension avec'],Quincunx:['peine à s\'aligner avec','peinent à s\'aligner avec']},
    it:{Conjunction:['si fonde con','si fondono con'],Trine:['fluisce in armonia con','fluiscono in armonia con'],Sextile:['coopera con','cooperano con'],Square:['sfida','sfidano'],Opposition:['entra in tensione con','entrano in tensione con'],Quincunx:['fatica ad allinearsi con','faticano ad allinearsi con']}};
  const _needsRaw=_evNeed[LANG]||_evNeed.en;
  const _verbsRaw=_evVerb[LANG]||_evVerb.en;
  // Build "article + noun + de + name" per language; returns {text, plural}
  function _evPhrase(planet,name){
    const raw=_needsRaw[planet];
    if(!raw)return{text:planet,plural:false};
    if(typeof raw==='string')return{text:`${name}'s ${raw}`,plural:false}; // EN
    const[art,noun,pl]=raw;
    return{text:`${art.endsWith('\'')?art:art+' '}${noun} de ${name}`,plural:!!pl};
  }
  function _evGetVerb(aspName,plural){
    const v=_verbsRaw[aspName];
    if(!v)return aspName;
    if(typeof v==='string')return v; // EN — no plural forms
    return plural?v[1]:v[0];
  }
  // Pick the strongest aspect of each type first, then fill remaining slots by strength
  const _withAsp=syn.filter(p=>p.asp&&p.asp.h!==0);
  const _byType=new Map();
  for(const p of _withAsp){
    const n=p.asp.name,score=Math.abs(p.asp.h)*(SW[`${p.pA}-${p.pB}`]||.4);
    if(!_byType.has(n)||score>_byType.get(n)._score)_byType.set(n,{...p,_score:score});
  }
  const _picked=new Set();
  const top=[..._byType.values()].sort((a,b)=>b._score-a._score);
  for(const p of top)_picked.add(`${p.pA}-${p.pB}`);
  // Fill remaining slots up to 6 with strongest unused aspects
  const _rest=_withAsp.filter(p=>!_picked.has(`${p.pA}-${p.pB}`)).sort((a,b)=>Math.abs(b.asp.h)*(SW[`${b.pA}-${b.pB}`]||.4)-Math.abs(a.asp.h)*(SW[`${a.pA}-${a.pB}`]||.4));
  while(top.length<6&&_rest.length)top.push(_rest.shift());
  document.getElementById('evcards').innerHTML=top.map(p=>{
    const fl=[];
    if(p.slowA||p.slowB)fl.push('<span style="color:var(--silver);font-size:10px">~p</span>');
    if((p.pA==='Moon'&&chartA.timeUnknown)||(p.pB==='Moon'&&chartB.timeUnknown))fl.push('<span style="color:var(--amber);font-size:10px">~t</span>');
    const pnA=trPlanet(p.pA,LANG),pnB=trPlanet(p.pB,LANG);
    const phA=_evPhrase(p.pA,nameA),phB=_evPhrase(p.pB,nameB);
    const verb=_evGetVerb(p.asp.name,phA.plural);
    const desc=(phA.text.charAt(0).toUpperCase()+phA.text.slice(1))+' '+verb+' '+phB.text;
    return`<div class="evcard"><div class="eva">${aspChip(p.asp)} <span style="color:var(--silver);font-size:12px;margin-left:6px">${PSYM[p.pA]||'↑'}${pnA} × ${PSYM[p.pB]||'↑'}${pnB}</span> ${fl.join(' ')}</div><div class="evd">${desc}</div></div>`;
  }).join('');
  document.getElementById('rbody').innerHTML=fmtHTML(text);
  document.getElementById('report-sec').style.display='block';
  // Report box already set expanded by runAll's setBox('report',true)
  const conf=computeConf(chartA,chartB,syn);
  renderConf(conf);
  // Scroll to report (first box)
  document.getElementById('report-sec').scrollIntoView({behavior:'smooth',block:'start'});
}

// ── MAIN ──
async function runAll(){
  const dA=document.getElementById('dateA').value;
  const dB=document.getElementById('dateB').value;
  const soloMode=!dA||!dB;
  if(!dA&&!dB){alert('Please enter at least one birth date.');return;}

  const tuA=document.getElementById('tuA').checked;
  const tuB=document.getElementById('tuB').checked;
  const csA=document.getElementById('cs-A').value.trim();
  const csB=document.getElementById('cs-B').value.trim();
  if(dA&&tuA&&!csA){alert(`Please select a birth city for ${document.getElementById('nameA').value||'Partner A'} — needed for latitude.`);return;}
  if(dB&&tuB&&!csB){alert(`Please select a birth city for ${document.getElementById('nameB').value||'Partner B'} — needed for latitude.`);return;}

  const btn=document.getElementById('calcBtn');btn.disabled=true;
  document.getElementById('prog').style.display='block';
  document.getElementById('res').style.display='none';
  document.getElementById('report-sec').style.display='none';
  document.getElementById('conf-sec').style.display='none';
  document.getElementById('natal-report-A-sec').style.display='none';
  document.getElementById('natal-data-A-sec').style.display='none';
  document.getElementById('natal-report-B-sec').style.display='none';
  document.getElementById('natal-data-B-sec').style.display='none';
  document.getElementById('solo-notice').style.display='none';

  const setBox=(id,open)=>{
    const body=document.getElementById(`body-${id}`);
    const hdr=document.getElementById(`hdr-${id}`);
    if(!body||!hdr)return;
    body.classList.toggle('collapsed',!open);
    body.classList.toggle('expanded',open);
    hdr.classList.toggle('collapsed',!open);
  };

  STATE.nameA=document.getElementById('nameA').value||'Partner A';
  STATE.nameB=document.getElementById('nameB').value||'Partner B';
  STATE.soloMode=soloMode;
  STATE.profileA=null;
  STATE.profileB=null;

  const ianaA=document.getElementById('ianaA').value||'UTC';
  const ianaB=document.getElementById('ianaB').value||'UTC';
  const timeStrA=document.getElementById('timeA').value||'12:00';
  const timeStrB=document.getElementById('timeB').value||'12:00';
  const tzA=tuA?0:(dA?ianaOffsetAtDate(ianaA,dA,timeStrA):(parseFloat(document.getElementById('tzA').value)||0));
  const tzB=tuB?0:(dB?ianaOffsetAtDate(ianaB,dB,timeStrB):(parseFloat(document.getElementById('tzB').value)||0));
  const latA=parseFloat(document.getElementById('latA').value)||42;
  const latB=parseFloat(document.getElementById('latB').value)||42;
  const lonA=parseFloat(document.getElementById('lonA').value)||0;
  const lonB=parseFloat(document.getElementById('lonB').value)||0;

  // ── Compute charts for whichever persons are filled ──
  if(dA){
    setP(5,'Computing chart A…');await sl(80);
    STATE.chartA=buildChart(dA,document.getElementById('timeA').value,tzA,tuA,latA,lonA);
    STATE.profileA=buildNatalProfile(STATE.chartA);
  } else {
    STATE.chartA=null;STATE.profileA=null;
  }
  if(dB){
    setP(dA?22:5,'Computing chart B…');await sl(60);
    STATE.chartB=buildChart(dB,document.getElementById('timeB').value,tzB,tuB,latB,lonB);
    STATE.profileB=buildNatalProfile(STATE.chartB);
  } else {
    STATE.chartB=null;STATE.profileB=null;
  }

  document.getElementById('res').style.display='block';

  if(soloMode){
    // ── SOLO MODE ──────────────────────────────────────────────────────────
    document.getElementById('solo-notice').style.display='block';
    // Hide compatibility sections
    document.getElementById('report-sec').style.display='none';
    document.getElementById('conf-sec').style.display='none';

    const activeSlot=dA?'A':'B';
    const activeName=dA?STATE.nameA:STATE.nameB;
    const activeProfile=dA?STATE.profileA:STATE.profileB;
    const activeChart=dA?STATE.chartA:STATE.chartB;
    const color=dA?'var(--rose)':'var(--azure)';

    setP(60,'Building natal profile…');await sl(80);

    STATE.syn=null;STATE.scoreData=null;
    buildTabButtons();renderNatal();

    setP(80,'Applying built-in rules…');await sl(60);
    try{
      setP(95,'Applying built-in rules…');await sl(80);
      const reportText=builtinNatalReport(activeProfile,activeName,LANG);
      setP(100,'Complete.');
      renderNatalProfileBox(activeProfile,activeName,activeSlot,color,reportText,true);
      setBox(`natal-report-${activeSlot}`,true);
      setBox(`natal-data-${activeSlot}`,true);
      // Show confidence index (natal mode, expanded)
      const nConf=computeNatalConf(activeProfile,activeName);
      renderConf(nConf);
      setBox('conf',true);
      setBox('traces',false);
      document.getElementById(`natal-report-${activeSlot}-sec`).scrollIntoView({behavior:'smooth',block:'start'});
    } catch(err){
      setP(100,`Error: ${err.message}`);
      renderNatalProfileBox(activeProfile,activeName,activeSlot,color,`<p style="color:var(--rose);font-style:italic">Oracle error: ${err.message}</p>`,true);
      const nConf=computeNatalConf(activeProfile,activeName);
      renderConf(nConf);setBox('conf',true);setBox('traces',false);
    }

  } else {
    // ── DUAL MODE ──────────────────────────────────────────────────────────
    setP(42,'Running synastry…');await sl(80);
    STATE.syn=buildSynastry(STATE.chartA,STATE.chartB);
    setP(58,'Scoring…');await sl(60);
    STATE.scoreData=scoreSyn(STATE.syn);
    setP(68,'Rendering traces…');await sl(60);
    buildTabButtons();renderNatal();renderSynastry();renderScores();renderRaw();

    // Build natal profiles (background, collapsed)
    setP(75,'Building natal profiles…');await sl(60);
    try{
      const nTextA=builtinNatalReport(STATE.profileA,STATE.nameA,LANG);
      const nTextB=builtinNatalReport(STATE.profileB,STATE.nameB,LANG);
      renderNatalProfileBox(STATE.profileA,STATE.nameA,'A','var(--rose)',nTextA,false);
      renderNatalProfileBox(STATE.profileB,STATE.nameB,'B','var(--azure)',nTextB,false);
      setBox('natal-report-A',false);setBox('natal-data-A',false);
      setBox('natal-report-B',false);setBox('natal-data-B',false);
    } catch(err){
      // Natal profiles are non-critical in dual mode — silently show error in box
      renderNatalProfileBox(STATE.profileA,STATE.nameA,'A','var(--rose)',`Oracle error: ${err.message}`,false);
      renderNatalProfileBox(STATE.profileB,STATE.nameB,'B','var(--azure)',`Oracle error: ${err.message}`,false);
    }

    // Main compatibility report
    setP(82,'Applying built-in rules…');await sl(80);
    setBox('report',true);setBox('conf',true);setBox('traces',false);
    try{
      setP(95,'Applying built-in rules…');await sl(100);
      const reportText=builtinReport(STATE.chartA,STATE.chartB,STATE.syn,STATE.scoreData.scores,STATE.nameA,STATE.nameB,LANG);
      setP(100,'Complete.');
      renderReport(reportText);
    } catch(err){
      setP(100,`Error: ${err.message}`);
      document.getElementById('rbody').innerHTML=`<p style="color:var(--rose);font-style:italic">Oracle error: ${err.message}</p>`;
      document.getElementById('banner').innerHTML='';
      document.getElementById('rings').innerHTML=RING_DEFS.map(r=>ring(ringLabel(r),STATE.scoreData.scores[r.k],r.c)).join('');
      document.getElementById('evcards').innerHTML='';
      document.getElementById('report-sec').style.display='block';
      setBox('report',true);
      renderConf(computeConf(STATE.chartA,STATE.chartB,STATE.syn));
      setBox('conf',true);
      document.getElementById('report-sec').scrollIntoView({behavior:'smooth'});
    }
  }

  btn.disabled=false;
  document.getElementById('exportBtn').style.display='';
}

// ── RESET ALL ──
function resetAll(){
  // Clear inputs
  ['nameA','nameB'].forEach(id=>{document.getElementById(id).value='';});
  ['dateA','dateB'].forEach(id=>{document.getElementById(id).value='';});
  ['timeA','timeB'].forEach(id=>{document.getElementById(id).value='12:00';document.getElementById(id).disabled=false;});
  ['tuA','tuB'].forEach(id=>{document.getElementById(id).checked=false;});
  ['cs-A','cs-B'].forEach(id=>{document.getElementById(id).value='';});
  ['tzA','tzB'].forEach(id=>{document.getElementById(id).value='';});
  ['latA','latB'].forEach(id=>{document.getElementById(id).value='42';});
  ['lonA','lonB'].forEach(id=>{document.getElementById(id).value='0';});
  ['ianaA','ianaB'].forEach(id=>{document.getElementById(id).value='UTC';});
  // Reset calendar state
  CAL_STATE.A={year:1990,month:2,day:null,view:'day'};
  CAL_STATE.B={year:1988,month:6,day:null,view:'day'};
  const dlA=document.getElementById('dlabel-A'),dlB=document.getElementById('dlabel-B');
  if(dlA){dlA.value='';dlA.classList.remove('invalid');}
  if(dlB){dlB.value='';dlB.classList.remove('invalid');}
  // Hide results
  document.getElementById('res').style.display='none';
  document.getElementById('prog').style.display='none';
  document.getElementById('exportBtn').style.display='none';
  ['report-sec','conf-sec','natal-report-A-sec','natal-data-A-sec','natal-report-B-sec','natal-data-B-sec','solo-notice'].forEach(id=>{document.getElementById(id).style.display='none';});
  // Clear result content
  ['rbody','banner','rings','syn-charts','tab-natal','tab-syn','tab-scores','tab-raw','natal-report-A-body','natal-data-A-body','natal-report-B-body','natal-data-B-body'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML='';});
  const ev=document.getElementById('evcards');if(ev)ev.innerHTML='';
  // Reset state
  STATE={chartA:null,chartB:null,syn:null,scoreData:null,nameA:'A',nameB:'B',soloMode:false,profileA:null,profileB:null};
  // Scroll to top
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── EXPORT PDF ──
function exportPDF(){
  // Expand all collapsed sections before printing
  const collapsed=[];
  document.querySelectorAll('.box-body.collapsed').forEach(el=>{
    collapsed.push(el);
    el.classList.remove('collapsed');
    el.classList.add('expanded');
  });
  document.querySelectorAll('.box-hdr.collapsed').forEach(el=>{
    el.classList.remove('collapsed');
    el._wasCollapsed=true;
  });
  // Expand all trace sections
  document.querySelectorAll('.cbody').forEach(el=>{
    if(el.style.display==='none'){el.style.display='';el._wasHidden=true;}
  });
  // Print
  setTimeout(()=>{
    window.print();
    // Restore collapsed state after print dialog closes
    setTimeout(()=>{
      collapsed.forEach(el=>{
        el.classList.add('collapsed');
        el.classList.remove('expanded');
      });
      document.querySelectorAll('.box-hdr').forEach(el=>{
        if(el._wasCollapsed){el.classList.add('collapsed');delete el._wasCollapsed;}
      });
      document.querySelectorAll('.cbody').forEach(el=>{
        if(el._wasHidden){el.style.display='none';delete el._wasHidden;}
      });
    },500);
  },100);
}

// ── HELP MODAL ──
const HELP_TABS=[
  {id:'guide',key:'helpGuide',labelKey:'helpTabGuide'},
  {id:'astro',key:'helpAstro',labelKey:'helpTabAstro'},
  {id:'about',key:'helpAbout',labelKey:'helpTabAbout'},
];
let _helpActiveTab='guide';

function loadHelpTab(id){
  _helpActiveTab=id;
  const body=document.getElementById('help-body');
  const tab=HELP_TABS.find(x=>x.id===id);
  if(tab)body.innerHTML=t(tab.key);
  document.querySelectorAll('.help-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
}

function _helpBuildTabs(){
  document.getElementById('help-tabs').innerHTML=HELP_TABS.map(x=>
    `<button class="help-tab${x.id===_helpActiveTab?' active':''}" data-tab="${x.id}" onclick="loadHelpTab('${x.id}')">${t(x.labelKey)}</button>`
  ).join('');
}

function openHelp(){
  _helpBuildTabs();
  loadHelpTab(_helpActiveTab);
  document.getElementById('help-overlay').classList.add('open');
  document.body.style.overflow='hidden';
  document.addEventListener('keydown',_helpEsc);
}

function closeHelp(){
  document.getElementById('help-overlay').classList.remove('open');
  document.body.style.overflow='';
  document.removeEventListener('keydown',_helpEsc);
}

function _helpEsc(e){if(e.key==='Escape')closeHelp();}

function openSolver(){
  const dA=document.getElementById('dateA').value;
  const csA=document.getElementById('cs-A').value.trim();
  if(!dA||!csA){alert(t('solverNeedA'));return;}
  applyI18N();
  document.getElementById('solver-overlay').classList.add('open');
  document.body.style.overflow='hidden';
  document.addEventListener('keydown',_solverEsc);
  // Reset state
  document.getElementById('solver-prog').style.display='none';
  document.getElementById('solver-results').style.display='none';
  document.getElementById('solver-run-btn').disabled=false;
  document.getElementById('solver-run-btn').textContent=t('solverRun');
}

function closeSolver(){
  _solverAbort=true;
  document.getElementById('solver-overlay').classList.remove('open');
  document.body.style.overflow='';
  document.removeEventListener('keydown',_solverEsc);
}

function _solverEsc(e){if(e.key==='Escape')closeSolver();}

async function runSolver(){
  _solverAbort=false;
  const dA=document.getElementById('dateA').value;
  const tuA=document.getElementById('tuA').checked;
  const ianaA=document.getElementById('ianaA').value||'UTC';
  const timeStrA=document.getElementById('timeA').value||'12:00';
  const tzA=tuA?0:ianaOffsetAtDate(ianaA,dA,timeStrA);
  const latA=parseFloat(document.getElementById('latA').value)||42;
  const lonA=parseFloat(document.getElementById('lonA').value)||0;

  // Build Person A's chart
  const chartA=buildChart(dA,timeStrA,tzA,tuA,latA,lonA);

  // Person B location: use solver city if filled, else Person A's
  const csSolver=document.getElementById('cs-solver').value.trim();
  const fixedCity=csSolver?{
    name:csSolver,
    lat:parseFloat(document.getElementById('latsolver').value)||42,
    lon:parseFloat(document.getElementById('lonsolver').value)||0,
    iana:document.getElementById('ianasolver').value||'UTC'
  }:null;
  const suggestCities=!fixedCity&&document.getElementById('solver-suggest-cities').checked;

  // Phase 1 reference city
  const refCity=fixedCity||{name:document.getElementById('cs-A').value,lat:latA,lon:lonA,iana:ianaA};

  const yrFrom=parseInt(document.getElementById('solver-yr-from').value)||1990;
  const yrTo=parseInt(document.getElementById('solver-yr-to').value)||2000;
  if(yrFrom>yrTo){alert('Year from must be ≤ year to.');return;}
  if(yrTo-yrFrom>50){alert('Maximum range is 50 years.');return;}

  // Build date list
  const dates=[];
  for(let y=yrFrom;y<=yrTo;y++){
    for(let m=1;m<=12;m++){
      const daysInMonth=new Date(y,m,0).getDate();
      for(let d=1;d<=daysInMonth;d++){
        const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        dates.push(ds);
      }
    }
  }

  const total=dates.length;
  const btn=document.getElementById('solver-run-btn');
  btn.textContent=t('solverStop');
  btn.onclick=()=>{_solverAbort=true;};
  btn.disabled=false;

  const prog=document.getElementById('solver-prog');
  const pbar=document.getElementById('solver-pbar');
  const plog=document.getElementById('solver-plog');
  prog.style.display='block';
  document.getElementById('solver-results').style.display='none';

  // Top-N tracker (keep best entries)
  const PHASE1_N=suggestCities?20:10;
  const top=[];

  function insertTop(arr,entry,maxN){
    let lo=0,hi=arr.length;
    while(lo<hi){const mid=(lo+hi)>>1;if(arr[mid].scores.overall>=entry.scores.overall)lo=mid+1;else hi=mid;}
    arr.splice(lo,0,entry);
    if(arr.length>maxN)arr.length=maxN;
  }

  // ── Phase 1: sweep dates with reference city ──
  const CHUNK=60;
  for(let i=0;i<total;i+=CHUNK){
    if(_solverAbort)break;
    const end=Math.min(i+CHUNK,total);
    for(let j=i;j<end;j++){
      const ds=dates[j];
      const tz=ianaOffsetAtDate(refCity.iana,ds,'12:00');
      const cB=buildChart(ds,'12:00',tz,true,refCity.lat,refCity.lon);
      const pairs=buildSynastry(chartA,cB);
      const{scores}=scoreSyn(pairs);
      if(top.length<PHASE1_N||scores.overall>top[top.length-1].scores.overall){
        insertTop(top,{date:ds,city:refCity.name,lat:refCity.lat,lon:refCity.lon,iana:refCity.iana,scores},PHASE1_N);
      }
    }
    const pct=suggestCities?Math.round(end/total*80):Math.round(end/total*100);
    pbar.style.width=pct+'%';
    plog.textContent=t('solverScanning').replace('{0}',end+'/'+total);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  }

  // ── Phase 2: refine top dates across world cities ──
  let finalTop;
  if(suggestCities&&!_solverAbort){
    plog.textContent=t('solverPhase2').replace('{0}',SOLVER_CITIES.length);
    finalTop=[];
    const topDates=top.map(e=>e.date);
    const phase2Total=topDates.length*SOLVER_CITIES.length;
    let phase2Done=0;
    for(const ds of topDates){
      if(_solverAbort)break;
      for(const city of SOLVER_CITIES){
        const tz=ianaOffsetAtDate(city.iana,ds,'12:00');
        const cB=buildChart(ds,'12:00',tz,true,city.lat,city.lon);
        const pairs=buildSynastry(chartA,cB);
        const{scores}=scoreSyn(pairs);
        if(finalTop.length<10||scores.overall>finalTop[finalTop.length-1].scores.overall){
          insertTop(finalTop,{date:ds,city:city.name,lat:city.lat,lon:city.lon,iana:city.iana,scores},10);
        }
        phase2Done++;
      }
      const pct=80+Math.round(phase2Done/phase2Total*20);
      pbar.style.width=pct+'%';
      plog.textContent=t('solverPhase2').replace('{0}',SOLVER_CITIES.length);
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    }
    // Also keep phase-1 winners that may still beat phase-2 results
    for(const e of top){
      if(finalTop.length<10||e.scores.overall>finalTop[finalTop.length-1].scores.overall){
        insertTop(finalTop,e,10);
      }
    }
  } else {
    finalTop=top.slice(0,10);
  }

  pbar.style.width='100%';
  if(suggestCities&&!_solverAbort){
    plog.textContent=t('solverDoneFull').replace('{0}',total).replace('{1}',SOLVER_CITIES.length);
  } else {
    plog.textContent=t(_solverAbort?'solverScanning':'solverDone').replace('{0}',total);
  }

  // Show results
  const res=document.getElementById('solver-results');
  const tbody=document.getElementById('solver-tbody');
  const showCity=suggestCities||fixedCity;
  if(finalTop.length===0){
    tbody.innerHTML=`<tr><td colspan="9" class="solver-none">${t('solverNoResults')}</td></tr>`;
  } else {
    tbody.innerHTML=finalTop.map((e,i)=>{
      const s=e.scores;
      const fmtDate=e.date.split('-').reverse().join('/');
      const esc=e.city.replace(/'/g,"\\'");
      return`<tr class="solver-row" onclick="applySolverResult('${e.date}','${esc}',${e.lat},${e.lon},'${e.iana}')">
        <td>${i+1}</td>
        <td>${fmtDate}</td>
        <td>${e.city}</td>
        <td class="score-overall">${s.overall}%<span class="score-bar" style="width:${s.overall*0.4}px"></span></td>
        <td>${s.love}%</td>
        <td>${s.harmony}%</td>
        <td>${s.passion}%</td>
        <td>${s.mental}%</td>
        <td>${s.karmic}%</td>
      </tr>`;
    }).join('');
  }
  res.style.display='block';

  btn.disabled=false;
  btn.textContent=t('solverRun');
  btn.onclick=runSolver;
}

function applySolverResult(dateStr,cityName,lat,lon,iana){
  // Populate Partner B fields
  const[y,m,d]=dateStr.split('-');
  document.getElementById('dateB').value=dateStr;
  document.getElementById('dlabel-B').value=`${d}/${m}/${y}`;
  document.getElementById('timeB').value='12:00';
  document.getElementById('tuB').checked=true;

  document.getElementById('cs-B').value=cityName;
  document.getElementById('latB').value=lat;
  document.getElementById('lonB').value=lon;
  document.getElementById('ianaB').value=iana;
  const tz=ianaOffsetAtDate(iana,dateStr,'12:00');
  document.getElementById('tzB').value=tz;

  // Set time unknown
  toggleTU('B');

  closeSolver();
}
